name: concurrency-probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - run: |
          echo "start=$(date -u +%FT%TZ) n=${{ matrix.n }} nproc=$(nproc) mem=$(free -m | awk '/Mem/{print $2}')MB"
          sleep 90
          echo "end=$(date -u +%FT%TZ)"
